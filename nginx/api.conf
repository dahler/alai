server {
    listen 80;
    server_name _;

    client_max_body_size 200M;
    client_body_timeout  300s;
    proxy_read_timeout   300s;
    proxy_send_timeout   300s;

    # ── CORS on every response, including nginx-generated errors (413, 502…) ──
    # These live at server level so they are inherited by the location block.
    # IMPORTANT: do NOT add any add_header directive inside location / or its
    # nested if blocks — nginx drops server-level inheritance the moment a
    # child block defines its own add_header.
    add_header 'Access-Control-Allow-Origin'      'https://alai.antaragpt.com' always;
    add_header 'Access-Control-Allow-Credentials' 'true'                        always;
    add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, X-Requested-With' always;
    add_header 'Access-Control-Max-Age'           '86400'                        always;

    # ── MCP server (Claude.ai remote integration) ────────────────────────────
    location /mcp/ {
        proxy_pass         http://mcp:8001/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Connection        '';   # keep SSE connection open
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;                  # SSE connections are long-lived
    }

    location / {
        # Short-circuit preflight without hitting the backend.
        # No add_header here — server-level headers above are inherited.
        if ($request_method = OPTIONS) {
            return 204;
        }

        # ── Proxy to backend ─────────────────────────────────────────────────
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable buffering so SSE (chat streaming) works
        proxy_buffering    off;
        proxy_cache        off;
    }
}
