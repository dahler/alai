server {
    listen 80;
    server_name _;

    client_max_body_size 200M;
    client_body_timeout  300s;
    proxy_read_timeout   300s;
    proxy_send_timeout   300s;

    location / {
        # ── Preflight (OPTIONS) ──────────────────────────────────────────────
        # add_header inside `if` is required because nginx does NOT inherit
        # server-level add_header directives when returning from an if block.
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin'      'https://alai.antaragpt.com' always;
            add_header 'Access-Control-Allow-Credentials' 'true'                        always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, X-Requested-With' always;
            add_header 'Access-Control-Max-Age'           '86400'                        always;
            add_header 'Content-Length'                   '0';
            return 204;
        }

        # ── Proxy to backend ─────────────────────────────────────────────────
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable buffering so SSE (chat streaming) works
        proxy_buffering    off;
        proxy_cache        off;

        # CORS on all proxied responses, including nginx error pages (413, 502…)
        add_header 'Access-Control-Allow-Origin'      'https://alai.antaragpt.com' always;
        add_header 'Access-Control-Allow-Credentials' 'true'                        always;
        add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, X-Requested-With' always;
    }
}
