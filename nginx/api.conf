server {
    listen 80;
    server_name _;

    # Allow large uploads (multiple documents)
    client_max_body_size 200M;
    client_body_timeout  300s;
    proxy_read_timeout   300s;
    proxy_send_timeout   300s;

    # CORS headers on EVERY response, including nginx error pages (413, 502, etc.)
    # Without `always`, headers are omitted on 4xx/5xx responses.
    add_header 'Access-Control-Allow-Origin'      'https://alai.antaragpt.com' always;
    add_header 'Access-Control-Allow-Credentials' 'true'                        always;
    add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, X-Requested-With' always;

    # Handle preflight (OPTIONS) immediately at nginx level
    if ($request_method = OPTIONS) {
        return 204;
    }

    location / {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Needed for SSE (streaming responses)
        proxy_buffering    off;
        proxy_cache        off;
    }
}
