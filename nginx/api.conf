# ── Redirect all plain-HTTP traffic to HTTPS ─────────────────────────────────
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── HTTPS / main server ───────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name _;

    # ── TLS — replace with your real cert paths ───────────────────────────────
    # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # ── TLS hardening ─────────────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    client_max_body_size 200M;
    client_body_timeout  300s;
    proxy_read_timeout   300s;
    proxy_send_timeout   300s;

    # ── Security headers ──────────────────────────────────────────────────────
    # Applied at server level so nginx-generated errors (413, 502 …) also
    # carry them. IMPORTANT: do NOT add add_header in nested location/if blocks
    # — nginx drops server-level inheritance the moment a child block defines
    # its own add_header.
    add_header 'Access-Control-Allow-Origin'      'https://alai.antaragpt.com' always;
    add_header 'Access-Control-Allow-Credentials' 'true'                        always;
    add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, X-Requested-With' always;
    add_header 'Access-Control-Max-Age'           '86400'                        always;

    add_header X-Content-Type-Options    'nosniff'                           always;
    add_header X-Frame-Options           'DENY'                              always;
    add_header X-XSS-Protection          '1; mode=block'                     always;
    add_header Referrer-Policy           'strict-origin-when-cross-origin'   always;
    add_header Permissions-Policy        'geolocation=(), microphone=(), camera=()' always;
    add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;

    # ── Auth endpoints — strict rate limit ────────────────────────────────────
    location ~ ^/api/auth/(login|callback) {
        limit_req zone=alai_auth burst=5 nodelay;
        limit_req_status 429;

        if ($request_method = OPTIONS) { return 204; }

        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
    }

    # ── File upload POST — medium rate limit ──────────────────────────────────
    location = /api/uploads {
        limit_req zone=alai_upload burst=5 nodelay;
        limit_req_status 429;

        if ($request_method = OPTIONS) { return 204; }

        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
    }

    # ── All other API traffic — general rate limit ────────────────────────────
    location / {
        limit_req zone=alai_api burst=30 nodelay;
        limit_req_status 429;

        if ($request_method = OPTIONS) { return 204; }

        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable buffering so SSE (chat streaming) works
        proxy_buffering    off;
        proxy_cache        off;
    }
}
