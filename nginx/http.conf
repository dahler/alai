# ── Rate-limit zones (http context) ──────────────────────────────────────────
# This file must be included inside the `http {}` block of nginx.conf:
#
#   http {
#       include /etc/nginx/conf.d/http.conf;
#       include /etc/nginx/conf.d/api.conf;
#   }
#
# Key: binary client IP  |  Zone size: 10m (~160k unique IPs per zone)
#
# alai_auth   —  10 req/min  — /api/auth/login and /api/auth/callback
# alai_upload — 20 req/min  — POST /api/uploads
# alai_api    — 200 req/min — everything else

limit_req_zone $binary_remote_addr zone=alai_auth:10m   rate=10r/m;
limit_req_zone $binary_remote_addr zone=alai_upload:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=alai_api:10m    rate=200r/m;
