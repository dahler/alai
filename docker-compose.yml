version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: alai-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build: ./backend
    container_name: alai-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/alai
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://localhost:8000/api/auth/callback}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5}
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:80", "https://alai.antaragpt.com"]'
      RAG_API_KEY: ${RAG_API_KEY:-}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # MCP Server — exposes RAG as a tool for Claude.ai remote MCP integration
  mcp:
    build: ./mcp_server
    container_name: alai-mcp
    environment:
      RAG_URL: http://backend:8000/api/rag/query
      RAG_API_KEY: ${RAG_API_KEY:-}
    expose:
      - "8001"
    depends_on:
      - backend

  # Nginx reverse proxy for the backend
  # Handles client_max_body_size and ensures CORS headers appear on all
  # responses (including nginx-level 413 errors from large uploads).
  api-proxy:
    image: nginx:1.27-alpine
    container_name: alai-api-proxy
    volumes:
      - ./nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"
    depends_on:
      - backend

  # React Frontend
  frontend:
    build: ./frontend
    container_name: alai-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
